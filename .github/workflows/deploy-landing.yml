name: Deploy landing site to GitHub Pages

# Publishes landing/ (the static site for p2pbuilders.org) on every push to
# main that touches it. One-time setup in the repo: Settings → Pages →
# Source: "GitHub Actions", then set the custom domain to p2pbuilders.org
# and point DNS at GitHub Pages.

on:
  push:
    branches: [main]
    paths: ['landing/**', '.github/workflows/deploy-landing.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
